name: Deploy Auth Service

on:
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types:
      - completed

jobs:
  update-manifest:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevOps Repo
        uses: actions/checkout@v4
        with:
          repository: patient-management-microservices/patient-management-devops
          token: ${{ secrets.DEVOPS_PAT }}
          ref: main

      - name: Get short SHA
        id: vars
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha_short=${SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Update image tag in K8s manifest
        run: |
          sed -i "s|image: ghcr.io/patient-management-microservices/auth-service:.*|image: ghcr.io/patient-management-microservices/auth-service:sha-${{ steps.vars.outputs.sha_short }}|" \
            k8s/services/auth-service.yaml

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/services/auth-service.yaml
          git diff --staged --quiet || git commit -m "chore: update auth-service image to sha-${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push